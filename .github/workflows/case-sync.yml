name: 培训案例自动同步

# 2026-11-01 建。
# 每周一、三、五、日 9:00（北京时间 = UTC 1:00）在云端读飞书表 dd29f7，
# 和云端 manualCases 比对：表里改了/新增了/删除了才写回；没变化什么都不做。
# 第一次运行只「认领」现有案例（打标记，不改内容），第二次起才真正按变化更新。
# 手动触发可勾 dry_run 先演练（只读不写）；勾 force 可越过「案例数少一半」的闸门。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只读演练（不写任何数据）'
        default: 'false'
      force:
        description: '强制（越过「案例数骤降一半」的闸门）'
        default: 'false'
  # 周一、三、五、日 9:00 北京时间 = UTC 1:00（GitHub Actions cron 用 UTC；0=周日）
  schedule:
    - cron: "0 1 * * 1,3,5,0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: case-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 不需要装任何依赖：脚本只用 Node 自带的 https/fs/crypto
      - name: 读飞书表 → 同步云端培训案例
        id: casesync
        run: node case-sync.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      # 失败告警：没这个的话，同步悄悄停掉也没人知道（页面会一直显示上一次的内容）
      - name: 同步失败告警（飞书）
        if: steps.casesync.outcome == 'failure'
        continue-on-error: true
        run: |
          node case-sync.js --alert-only "⚠️ **培训案例自动同步未完成**（脚本异常退出，详见运行日志）。云端培训案例没有被修改，页面仍是上一次的内容。常见原因：飞书表读不到/没权限、云端读取失败、表里案例数突然少一半（闸门拦下）、写入后回读不一致。"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
