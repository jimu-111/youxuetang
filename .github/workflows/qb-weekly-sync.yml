name: 题库定期同步

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只读演练（不写任何数据）'
        default: 'false'
      force:
        description: '强制（跳过守卫：行数骤降 / 删除量过大）'
        default: 'false'
  # 周一/周三/周五/周日 8:00 北京时间 = UTC 0:00（GitHub Actions cron 为 UTC）
  schedule:
    - cron: "0 0 * * 1,3,5,0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: qb-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ↓↓↓ 新增：源1（wiki 题库）→ 源2（优学堂题库源文档）对账同步
      #     仅周一执行；失败不阻断下方的题库同步
      - name: 源1→源2 对账同步（仅周一）
        id: srcsync
        continue-on-error: true
        run: node qb-source-sync.js
        env:
          ONLY_MONDAY: 'true'
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 对上一步的"失败"告警：continue-on-error 会让 job 层面仍是成功，所以必须看 step 的 outcome
      # 目的：对账没成功也要让你知道（因为下面的题库同步仍会继续上线）
      - name: 对账失败告警（飞书）
        if: steps.srcsync.outcome == 'failure'
        continue-on-error: true
        run: node qb-source-sync.js --alert-only "⚠️ **源1→源2 对账未跑完**（脚本异常退出，详见上方运行日志）。注意：下面的「题库同步」**仍会继续执行**，优学堂可能用**未对账的源2 数据**上线，请尽快人工检查。"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 上传同步报告与备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-source-sync-${{ github.run_id }}
          path: qb-source-sync-*.json
          retention-days: 30
          if-no-files-found: ignore
      # ↑↑↑

      - name: 读飞书总表 7 品类 → 全量覆盖源区（保留手动区）
        run: node qb-weekly-sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
