name: 题库定期同步

# 2026-09-13 加固：
#   ① 题库步骤加 id:qbsync，补上缺失的 FORCE 透传（原来手动触发选 force 对题库无效）
#   ② 新增「题库同步失败告警（飞书）」——之前题库同步失败是**静默**的：脚本 exitCode=1 只让 job
#      变红，没人会天天盯 Actions 页面，结果会是「题库悄悄停在旧数据上」而无人察觉。
#   ③ 修正「对账失败告警」文案 —— 06ab400 给题库步骤加了 if: ...== 'success' 之后，对账失败时
#      题库同步是**被跳过**的，原文案却写「仍会继续执行」，正好说反了。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只读演练（不写任何数据）'
        default: 'false'
      force:
        description: '强制（越过守卫：对账删除量过大 / 题库题数骤降超 10%）'
        default: 'false'
  # 每周日 8:00 北京时间 = UTC 周日 0:00（GitHub Actions cron 用 UTC）
  # 2026-09-13 改：只保留周日一次，取消原来的 周一/周三/周五 三次
  schedule:
    - cron: "0 0 * * 0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: qb-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ↓↓↓ 源1（wiki 题库）→ 源2（优学堂题库源文档）对账同步
      #     2026-09-13：定时改为只有周日后，这里必须**去掉 ONLY_MONDAY** ——
      #     脚本的守卫是「ONLY_MONDAY=true 且非 UTC 周一就跳过」，周日运行会被它静默跳过、
      #     对账等于关掉。去掉后每次运行（都是周日）都会对账，仍跑在题库同步之前，
      #     保证题库读到的是刚对过账的源2。失败不阻断下方的题库同步。
      - name: 源1→源2 对账同步（周日在题库同步之前）
        id: srcsync
        continue-on-error: true
        run: node qb-source-sync.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 2026-09-20：飞书应用密钥不再写在 qb-source-sync.js / qb-weekly-sync.js 里
          #   （那两个文件在公开仓库根目录，写上就等于公开）。改由仓库 Secrets 注入。
          #   没配也不会立刻挂：这两个脚本换 token 会退到代理那条路，由代理补密钥 ——
          #   但配上是正路，别依赖兜底。
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      # 对上一步的"失败"告警：continue-on-error 会让 job 层面仍是成功，所以必须看 step 的 outcome
      # 2026-09-13 修正文案：题库同步现在是 if: srcsync.outcome == 'success'，对账异常时它**会被跳过**，
      # 所以这次运行优学堂用的仍是**上周的题库**（安全，只是没更新），而不是「用未对账的数据上线」。
      - name: 对账失败告警（飞书）
        if: steps.srcsync.outcome == 'failure'
        continue-on-error: true
        run: node qb-source-sync.js --alert-only "⚠️ **源1→源2 对账未跑完**（脚本异常退出，详见运行日志）。本次运行的**题库同步已被跳过** —— 优学堂仍是**上周的题库**，数据不会错乱，只是这周不更新。修好后手动触发一次即可补上。"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: 上传同步报告与备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-source-sync-${{ github.run_id }}
          path: qb-source-sync-*.json
          retention-days: 30
          if-no-files-found: ignore
      # ↑↑↑

      # 2026-09-13：对账「异常退出」（step outcome=failure）时跳过题库同步 —— 那种情况源2 可能
      # 停在半截状态（删了几行然后挂掉），全量覆盖会把半截数据搬上优学堂。
      # 脚本「写前中止」（安全阀拦下、源2 一个格都没动）算正常退出 outcome=success，此时照常同步，
      # 只是这周没有更新 —— 这是安全的。（对账异常时会有飞书告警，修好后手动触发一次即可补上）
      #
      # 手动区已砍（2026-09-13）：页面不再增删改题，题库全量由本脚本维护，没有需要「保留」的区域。
      - name: 读飞书总表 7 品类 → 全量覆盖题库
        id: qbsync
        if: steps.srcsync.outcome == 'success'
        run: node qb-weekly-sync.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 手动触发选 dry_run 时，题库同步也只读不写（原来漏了这个，演练会真的写库）
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # 2026-09-13 补：原来只透传给对账脚本，手动触发选 force 对题库无效
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      # 2026-09-13 新增：题库同步失败告警。
      #   用 steps.qbsync.outcome == 'failure' 而不是 failure()：对账失败时题库步骤是被 **skip**
      #   的，那种情况已由上面的「对账失败告警」负责，不该在这里误报成「题库同步失败」。
      #   脚本内部四道闸门（某品类读值失败 / 某品类 0 题 / 现有题库读不到 / 题数缩水超 10%）
      #   拦下时会以 exitCode=1 退出，所以都会走到这里，日志里写明了是哪道闸门。
      - name: 题库同步失败告警（飞书）
        if: steps.qbsync.outcome == 'failure'
        continue-on-error: true
        run: |
          node qb-weekly-sync.js --alert-only "⚠️ **题库同步未完成**（脚本异常退出，详见运行日志）。**云端题库没有被修改** —— 优学堂用的仍是上周的题库，不是数据错乱，只是这周没更新。常见原因：某品类读值失败 / sheet 被改名或删除 / 题数骤降超 10% / 云端题库读不到。运行日志里会写明是哪一道闸门拦下的。"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
