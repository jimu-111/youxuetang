name: 周一自动推送

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（忽略本周已推送标记）'
        required: false
        default: 'false'
  # 2026-08-31 重新注册定时触发器（GitHub Actions 后端 8-26 起丢失 schedule 触发，任何内容改动可强制重注册）
  schedule:
    - cron: "30 2 * * 1"

# 2026-09-15 新增：同一个 concurrency group 的作业不能同时跑 —— 后来的排队等，等前一个跑完再启动。
# 为什么需要：现在有两条通道都会在周一 10:30（北京）触发本工作流 ——
#   ① GitHub 自己的 schedule（保留当兜底）  ② Cloudflare Worker 的 cron 调 workflow_dispatch（主力）
# 而 feishu-auto-push.js 的防重是「先读「已推送」标记 → 发完卡片才写标记」（第 268 行读、第 836 行写），
# 中间隔着拉 token、读飞书表格、分析上周、生成考试、发卡片整个流程（几十秒）。
# 两条通道若同时开跑，会双双读到「还没有标记」→ 各发一遍 → 员工收到重复卡片。
# 加了 concurrency 后第二个 run 会排队，等第一个落锁后才启动，一读标记就跳过。零延迟，且对以后新增的触发源自动生效。
# 注：cancel-in-progress 保持 false（默认值），是「排队等待」而不是「取消前一个」——
#     取消会打断正在发的推送，排队才安全。
concurrency:
  group: auto-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 2026-09-22：培训资料要「收件人打开就有图、零点击」，就得把每张照片都嵌进报告，
      #   而飞书原图平均 2.08MB/张 —— 所以要在服务器上先压到 900px（显示框只有 400px，够了）。
      #   靠根目录 package.json 里声明的 sharp。
      # ⚠️ 装不上**不能让推送哑掉**：脚本里 require('sharp') 是 try/catch 的，
      #   拿不到就退回「只用 KV 里现成的压缩图」，剩下的留占位图（点一下能看），卡片照发。
      #   所以这里用 `|| echo` 把失败吞掉（失败也是 exit 0）。
      - name: 装图片压缩库（失败不影响推送）
        run: npm install --no-audit --no-fund || echo "⚠️ sharp 没装上 —— 本次照片退回占位图模式，推送照发"
      - name: 分析上周数据并推送
        run: node feishu-auto-push.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          # 2026-09-20：飞书应用密钥不再写在 feishu-auto-push.js 里（那个文件在公开仓库根目录，
          #   写上就等于公开）。改由仓库 Secrets 注入，Secret 名就叫 FEISHU_APP_SECRET。
          #   ⚠️ 更正（2026-09-21）：原注释写「没配 Secret 脚本会当场报错退出」——**已经不成立**。
          #   当天给 feishu-auto-push.js 加了 feishuPost()：有密钥就直连、直连被拒(如密钥末尾多粘了
          #   换行，飞书回 200+code 10003)或没密钥时**自动退回 Pages 代理**，由代理用 Cloudflare 环境变量
          #   里的真值补上。所以这个 Secret 现在是「有更好、没有也能跑」，不再是单点。
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
